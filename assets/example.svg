<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pad to multiple example">
  <rect width="760" height="220" fill="#111827"/>
  <text x="24" y="34" fill="#e5e7eb" font-size="20" font-family="Arial, sans-serif">ImagePadToMultiple example (multiple_of = 16, color = gray)</text>
  <rect x="28" y="60" width="302" height="142" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <rect x="44" y="76" width="257" height="97" fill="#22d3ee"/>
  <text x="44" y="192" fill="#d1d5db" font-size="14" font-family="Arial, sans-serif">Input: 257×97</text>
  <text x="346" y="132" fill="#f3f4f6" font-size="40" font-family="Arial, sans-serif">→</text>
  <rect x="412" y="60" width="304" height="144" fill="#1f2937" stroke="#9ca3af" stroke-width="2"/>
  <rect x="428" y="76" width="257" height="97" fill="#22d3ee"/>
  <rect x="685" y="76" width="15" height="97" fill="#808080"/>
  <rect x="428" y="173" width="272" height="15" fill="#808080"/>
  <text x="428" y="198" fill="#d1d5db" font-size="14" font-family="Arial, sans-serif">Output: 272×112 (right + bottom padded)</text>
</svg>
